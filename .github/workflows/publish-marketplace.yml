name: Publish to Visual Studio Marketplace
on:
  workflow_dispatch:
    inputs:
      remove_legacy_preview:
        description: Remove version 1.0.0 containing the retired preview
        type: boolean
        default: false
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate publisher
        run: node -e 'if (require("./package.json").publisher !== "Toximiner") throw new Error("Unexpected publisher")'
      - run: npm ci
      - run: npm run package
      - name: Remove retired Marketplace version
        if: inputs.remove_legacy_preview
        run: node scripts/remove-legacy-version.cjs
      - name: Publish through Trusted Publishing
        if: ${{ !inputs.remove_legacy_preview }}
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath *.vsix
